<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} — {{ T "home" }}">
      <span class="brand-mark" aria-hidden="true"></span><span class="brand-text">{{ site.Title }}</span><span class="cursor" aria-hidden="true">_</span>
    </a>
    <nav aria-label="{{ T "mainNav" }}">
      <ul>
        {{- $cur := . }}
        {{- range site.Menus.main }}
        {{- $active := or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) (and .Page (eq $cur.Section .Page.Section) (ne $cur.Section "")) }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
